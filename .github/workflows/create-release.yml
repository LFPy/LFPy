# This workflow automatically creates a GitHub release when a push to master
# changes the version in LFPy/version.py (e.g., when a PR is merged).
# The release tag follows the convention v{version} (e.g., v2.3.9 or v2.3.9rc1)
# and the release name follows the convention LFPy-{version}.
# Pre-release versions (aN, bN, rcN, .devN) are marked as GitHub pre-releases.
# After a new release is created, the publish job uploads the package to
# TestPyPI and PyPI.
# Note: releases created via GITHUB_TOKEN do not trigger the separate
# python-publish.yml workflow, so the publish steps are included here directly.

name: Create GitHub Release

on:
  push:
    branches: [ master ]

jobs:
  release:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      released: ${{ steps.set_released.outputs.released }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get version from version.py
      id: get_version
      run: |
        version=$(grep -oP '(?<=version = ")[^"]+' LFPy/version.py)
        echo "version=${version}" >> $GITHUB_OUTPUT

    - name: Check version.py matches pyproject.toml
      run: |
        pyproject_version=$(grep -m1 -oP '^version = "\K[^"]+' pyproject.toml)
        if [ "${pyproject_version}" != "${{ steps.get_version.outputs.version }}" ]; then
          echo "::error::Version mismatch: LFPy/version.py=${{ steps.get_version.outputs.version }}, pyproject.toml=${pyproject_version}"
          exit 1
        fi

    - name: Check if release tag already exists
      id: check_tag
      run: |
        if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.get_version.outputs.version }}" > /dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Create GitHub Release
      if: steps.check_tag.outputs.exists == 'false'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        prerelease_flag=""
        if [[ "${VERSION}" =~ [0-9](a|b|rc|\.dev)[0-9]*$ ]]; then
          prerelease_flag="--prerelease"
        fi
        gh release create "v${VERSION}" \
          --title "LFPy-${VERSION}" \
          --generate-notes \
          ${prerelease_flag}

    - name: Set released output
      id: set_released
      run: |
        echo "released=${{ steps.check_tag.outputs.exists == 'false' }}" >> $GITHUB_OUTPUT

  build_wheels:

    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cibw_archs: x86_64 aarch64
          - os: macos-latest-intel
            cibw_archs: x86_64
          - os: macos-latest
            cibw_archs: arm64
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up QEMU
      if: runner.os == 'Linux'
      uses: docker/setup-qemu-action@v3
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install build tools
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "cibuildwheel>=3.1.0"
    - name: Build wheels
      shell: bash
      env:
        CIBW_BUILD: cp310-* cp311-* cp312-* cp313-* cp314-*
        CIBW_ARCHS: ${{ matrix.cibw_archs }}
        CIBW_BUILD_FRONTEND: build
        CIBW_BEFORE_BUILD: python -m pip install --upgrade pip "Cython>=3.0" "numpy>=1.8"
      run: |
        python -m cibuildwheel --output-dir wheelhouse
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: ./wheelhouse/*.whl

  build_sdist:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install build tools
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install poetry
    - name: Build source distribution
      shell: bash
      run: |
        poetry build --format sdist
    - name: Upload sdist
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz

  publish:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install twine
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install twine
    - name: Download artifacts
      uses: actions/download-artifact@v4.1.3
      with:
        path: dist
        merge-multiple: true
    - name: Publish to Test PyPI
      shell: bash
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.GH_TESTPYPI_LFPY_TOKEN }}
      run: |
        twine upload --repository-url https://test.pypi.org/legacy/ --skip-existing dist/* --verbose
    - name: Publish to PyPI
      shell: bash
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.GH_PYPI_LFPY_TOKEN }}
      run: |
        twine upload dist/* --verbose
